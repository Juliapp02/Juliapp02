name: GitHub Skyline 
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps: 
      - uses: lowlighter/metrics@latest 
        with:
          filename: metrics.plugin.skyline.svg 
          token: NOT_NEEDED                    
          base: ""                           
          plugin_skyline: yes
          plugin_skyline_year: current-year
